aid: amera
name: Amera
description: >-
  Amera (Amera Health Solutions) is a Seattle-based, Y Combinator (Fall 2025)
  healthcare technology company that automates claims processing workflows for
  health insurance payers, third-party administrators (TPAs), and self-insured
  employers. Its normalization engine ingests messy claim inputs from any source
  — EDI, PDFs, paper, fax, and proprietary/non-standard formats — and turns them
  into adjudication-ready, structured data that plugs into existing claims cores
  via API, EDI, or SFTP. The platform automates validation, reconciliation,
  stop-loss reporting, and real-time visibility and analytics, reducing plan
  administration costs and cutting carrier submission times from weeks to
  minutes while keeping full audit trails and HIPAA compliance. Founded in 2025
  by Louise Tanski and Deep Kapur (both formerly of Rupa Health), Amera already
  works with payers and plan administrators representing roughly 100,000 members.
  This profile is maintained by the API Evangelist network; Amera does not yet
  publish a public developer portal or API specification.
